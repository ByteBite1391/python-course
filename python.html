<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>آموزش پایتون - از صفر تا متوسط | Python Course</title>
    
    <!-- فونت وزیر از CDN -->
    <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet" type="text/css" />
    
    <style>
        :root {
            --bg: #f8fafc;
            --surface: #ffffff;
            --surface2: #f1f5f9;
            --text: #1e293b;
            --text2: #475569;
            --text3: #94a3b8;
            --primary: #3b82f6;
            --primary-light: #eff6ff;
            --primary-dark: #2563eb;
            --accent: #10b981;
            --accent-light: #ecfdf5;
            --warning: #f59e0b;
            --warning-light: #fffbeb;
            --danger: #ef4444;
            --danger-light: #fef2f2;
            --border: #e2e8f0;
            --shadow: 0 1px 3px rgba(0, 0, 0, .06), 0 1px 2px rgba(0, 0, 0, .04);
            --shadow-lg: 0 10px 25px rgba(0, 0, 0, .08), 0 4px 10px rgba(0, 0, 0, .04);
            --shadow-xl: 0 20px 40px rgba(0, 0, 0, .1);
            --radius: 12px;
            --radius-sm: 8px;
            --radius-xs: 6px;
            --transition: .2s cubic-bezier(.4, 0, .2, 1);
            --sidebar-w: 260px;
            --navbar-h: 64px;
            --font: 'Vazirmatn', 'Tahoma', 'Segoe UI', sans-serif;
            --code-bg: #1e293b;
            --code-text: #e2e8f0;
            --code-keyword: #c084fc;
            --code-string: #86efac;
            --code-func: #fde047;
            --code-comment: #64748b;
            --code-number: #fca5a5;
            --code-builtin: #67e8f9;
            --code-operator: #f472b6;
        }
        .dark {
            --bg: #0f172a;
            --surface: #1e293b;
            --surface2: #273549;
            --text: #f1f5f9;
            --text2: #cbd5e1;
            --text3: #64748b;
            --primary: #60a5fa;
            --primary-light: #1e3a5f;
            --primary-dark: #93bbfd;
            --accent: #34d399;
            --accent-light: #064e3b;
            --warning: #fbbf24;
            --warning-light: #451a03;
            --danger: #f87171;
            --danger-light: #450a0a;
            --border: #334155;
            --shadow: 0 1px 3px rgba(0, 0, 0, .3);
            --shadow-lg: 0 10px 25px rgba(0, 0, 0, .4);
            --shadow-xl: 0 20px 40px rgba(0, 0, 0, .5);
            --code-bg: #0f172a;
        }
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        html {
            scroll-behavior: smooth;
            font-size: 16px;
        }
        body {
            font-family: var(--font);
            background: var(--bg);
            color: var(--text);
            line-height: 1.75;
            transition: background var(--transition), color var(--transition);
            min-height: 100vh;
            overflow-x: hidden;
        }
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: var(--text3);
            border-radius: 3px;
        }
        ::selection {
            background: var(--primary);
            color: #fff;
        }
        a {
            color: var(--primary);
            text-decoration: none;
            transition: color var(--transition);
        }
        a:hover {
            color: var(--primary-dark);
        }
        button {
            font-family: var(--font);
            cursor: pointer;
            border: none;
            outline: none;
            transition: all var(--transition);
            font-size: .9rem;
        }
        .navbar {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            height: var(--navbar-h);
            background: var(--surface);
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 1.5rem;
            z-index: 1000;
            box-shadow: var(--shadow);
            transition: all var(--transition);
        }
        .navbar-brand {
            display: flex;
            align-items: center;
            gap: .6rem;
            font-weight: 800;
            font-size: 1.25rem;
            color: var(--primary);
        }
        .navbar-brand .logo-icon {
            width: 38px;
            height: 38px;
            border-radius: var(--radius-xs);
            background: linear-gradient(135deg, #3b82f6, #10b981);
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            font-size: 1.3rem;
            font-weight: 900;
        }
        .navbar-actions {
            display: flex;
            align-items: center;
            gap: .75rem;
        }
        .btn {
            padding: .55rem 1.1rem;
            border-radius: var(--radius-xs);
            font-weight: 600;
            font-size: .85rem;
            display: inline-flex;
            align-items: center;
            gap: .4rem;
            white-space: nowrap;
            letter-spacing: .01em;
        }
        .btn-primary {
            background: var(--primary);
            color: #fff;
        }
        .btn-primary:hover {
            background: var(--primary-dark);
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(59, 130, 246, .35);
        }
        .btn-outline {
            background: transparent;
            border: 2px solid var(--border);
            color: var(--text);
        }
        .btn-outline:hover {
            border-color: var(--primary);
            color: var(--primary);
            background: var(--primary-light);
        }
        .btn-sm {
            padding: .35rem .75rem;
            font-size: .78rem;
            border-radius: var(--radius-xs);
        }
        .btn-accent {
            background: var(--accent);
            color: #fff;
        }
        .btn-accent:hover {
            filter: brightness(1.1);
            transform: translateY(-1px);
        }
        .btn-icon {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--surface2);
            border: 1px solid var(--border);
            color: var(--text);
            font-size: 1.1rem;
        }
        .btn-icon:hover {
            background: var(--primary-light);
            border-color: var(--primary);
            color: var(--primary);
        }
        .sidebar {
            position: fixed;
            top: var(--navbar-h);
            right: 0;
            width: var(--sidebar-w);
            height: calc(100vh - var(--navbar-h));
            background: var(--surface);
            border-left: 1px solid var(--border);
            overflow-y: auto;
            z-index: 900;
            transition: transform var(--transition), background var(--transition);
            padding: 1rem 0;
            box-shadow: var(--shadow-lg);
        }
        .sidebar.closed {
            transform: translateX(100%);
        }
        .sidebar-toggle {
            display: none;
            position: fixed;
            top: calc(var(--navbar-h) + 1rem);
            right: 1rem;
            z-index: 999;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: var(--surface);
            border: 1px solid var(--border);
            box-shadow: var(--shadow-lg);
            color: var(--text);
            font-size: 1.2rem;
            cursor: pointer;
            align-items: center;
            justify-content: center;
        }
        .sidebar-section {
            padding: .5rem 1rem;
            font-size: .75rem;
            font-weight: 700;
            color: var(--text3);
            text-transform: uppercase;
            letter-spacing: .05em;
        }
        .sidebar-item {
            display: flex;
            align-items: center;
            gap: .6rem;
            padding: .65rem 1.2rem;
            margin: .15rem .6rem;
            border-radius: var(--radius-xs);
            cursor: pointer;
            transition: all var(--transition);
            font-size: .88rem;
            color: var(--text2);
            font-weight: 500;
            position: relative;
        }
        .sidebar-item:hover {
            background: var(--surface2);
            color: var(--text);
        }
        .sidebar-item.active {
            background: var(--primary-light);
            color: var(--primary);
            font-weight: 700;
        }
        .sidebar-item .chapter-num {
            width: 26px;
            height: 26px;
            border-radius: 50%;
            background: var(--surface2);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: .7rem;
            font-weight: 700;
            flex-shrink: 0;
        }
        .sidebar-item.active .chapter-num {
            background: var(--primary);
            color: #fff;
        }
        .sidebar-item .check-icon {
            margin-right: auto;
            color: var(--accent);
            font-size: .9rem;
            opacity: 0;
            transition: opacity var(--transition);
        }
        .sidebar-item.completed .check-icon {
            opacity: 1;
        }
        .main-content {
            margin-right: var(--sidebar-w);
            margin-top: var(--navbar-h);
            padding: 2rem;
            min-height: calc(100vh - var(--navbar-h));
            transition: margin var(--transition);
        }
        .main-content.expanded {
            margin-right: 0;
        }
        .container {
            max-width: 960px;
            margin: 0 auto;
        }
        .card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 1.5rem;
            margin-bottom: 1.25rem;
            box-shadow: var(--shadow);
            transition: all var(--transition);
        }
        .card:hover {
            box-shadow: var(--shadow-lg);
        }
        .card-header {
            font-weight: 700;
            font-size: 1.1rem;
            margin-bottom: .75rem;
            display: flex;
            align-items: center;
            gap: .5rem;
        }
        .grid-2 {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 1.25rem;
        }
        .hero-card {
            background: linear-gradient(135deg, #1e40af, #3b82f6, #10b981);
            color: #fff;
            border: none;
            border-radius: var(--radius);
            padding: 2rem;
            text-align: center;
            box-shadow: var(--shadow-xl);
            position: relative;
            overflow: hidden;
        }
        .hero-card::after {
            content: '';
            position: absolute;
            width: 300px;
            height: 300px;
            background: rgba(255, 255, 255, .06);
            border-radius: 50%;
            top: -100px;
            left: -100px;
        }
        .hero-card h1 {
            font-size: 2.2rem;
            font-weight: 900;
            margin-bottom: .5rem;
            position: relative;
            z-index: 1;
        }
        .hero-card p {
            font-size: 1.05rem;
            opacity: .9;
            position: relative;
            z-index: 1;
        }
        .mode-card {
            cursor: pointer;
            transition: all var(--transition);
            border: 2px solid var(--border);
            text-align: center;
            padding: 2rem 1.5rem;
            position: relative;
            overflow: hidden;
        }
        .mode-card:hover {
            border-color: var(--primary);
            transform: translateY(-4px);
            box-shadow: var(--shadow-xl);
        }
        .mode-card .mode-icon {
            font-size: 3rem;
            margin-bottom: .75rem;
        }
        .mode-card h3 {
            font-size: 1.2rem;
            font-weight: 700;
            margin-bottom: .4rem;
        }
        .mode-card p {
            color: var(--text2);
            font-size: .9rem;
        }
        .mode-card.teacher-card {
            border-top: 4px solid #3b82f6;
        }
        .mode-card.student-card {
            border-top: 4px solid #10b981;
        }
        .progress-bar-wrap {
            background: var(--surface2);
            border-radius: 20px;
            height: 10px;
            overflow: hidden;
            margin: .5rem 0;
        }
        .progress-bar-fill {
            height: 100%;
            border-radius: 20px;
            background: linear-gradient(90deg, #3b82f6, #10b981);
            transition: width .5s ease;
        }
        .progress-text {
            font-size: .85rem;
            font-weight: 600;
            color: var(--text2);
        }
        .code-block {
            background: var(--code-bg);
            color: var(--code-text);
            border-radius: var(--radius-sm);
            padding: 1.2rem;
            font-family: 'Fira Code', 'Courier New', monospace;
            font-size: .88rem;
            line-height: 1.8;
            direction: ltr;
            text-align: left;
            overflow-x: auto;
            position: relative;
            margin: 1rem 0;
            border: 1px solid var(--border);
        }
        .code-block .copy-btn {
            position: absolute;
            top: .5rem;
            left: .5rem;
            background: rgba(255, 255, 255, .1);
            border: none;
            color: #fff;
            padding: .3rem .7rem;
            border-radius: 4px;
            font-size: .75rem;
            cursor: pointer;
            opacity: .7;
            transition: opacity var(--transition);
        }
        .code-block .copy-btn:hover {
            opacity: 1;
        }
        .keyword { color: var(--code-keyword); }
        .string { color: var(--code-string); }
        .func { color: var(--code-func); }
        .comment { color: var(--code-comment); font-style: italic; }
        .number { color: var(--code-number); }
        .builtin { color: var(--code-builtin); }
        .operator { color: var(--code-operator); }
        .search-bar {
            display: flex;
            align-items: center;
            gap: .5rem;
            background: var(--surface);
            border: 2px solid var(--border);
            border-radius: 30px;
            padding: .5rem 1rem;
            transition: all var(--transition);
            max-width: 400px;
        }
        .search-bar:focus-within {
            border-color: var(--primary);
            box-shadow: 0 0 0 4px rgba(59, 130, 246, .1);
        }
        .search-bar input {
            border: none;
            background: transparent;
            outline: none;
            flex: 1;
            font-family: var(--font);
            font-size: .9rem;
            color: var(--text);
        }
        .search-bar .search-icon {
            color: var(--text3);
        }
        .search-results {
            position: absolute;
            top: 100%;
            left: 0;
            right: 0;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            box-shadow: var(--shadow-xl);
            max-height: 300px;
            overflow-y: auto;
            z-index: 100;
            display: none;
        }
        .search-results.show {
            display: block;
        }
        .search-result-item {
            padding: .7rem 1rem;
            cursor: pointer;
            border-bottom: 1px solid var(--border);
            transition: background var(--transition);
        }
        .search-result-item:hover {
            background: var(--surface2);
        }
        .search-wrap {
            position: relative;
        }
        .quiz-option {
            display: block;
            padding: .7rem 1rem;
            margin: .4rem 0;
            border: 2px solid var(--border);
            border-radius: var(--radius-xs);
            cursor: pointer;
            transition: all var(--transition);
            font-size: .9rem;
            background: var(--surface);
            text-align: right;
            width: 100%;
        }
        .quiz-option:hover {
            border-color: var(--primary);
            background: var(--primary-light);
        }
        .quiz-option.correct {
            border-color: var(--accent) !important;
            background: var(--accent-light) !important;
            color: #065f46 !important;
        }
        .quiz-option.wrong {
            border-color: var(--danger) !important;
            background: var(--danger-light) !important;
            color: #991b1b !important;
        }
        .quiz-option:disabled {
            pointer-events: none;
        }
        .badge {
            display: inline-block;
            padding: .2rem .6rem;
            border-radius: 20px;
            font-size: .75rem;
            font-weight: 600;
        }
        .badge-primary {
            background: var(--primary-light);
            color: var(--primary);
        }
        .badge-accent {
            background: var(--accent-light);
            color: var(--accent);
        }
        .badge-warning {
            background: var(--warning-light);
            color: var(--warning);
        }
        .teacher-section {
            border-right: 3px solid var(--primary);
            padding-right: 1rem;
            margin: 1rem 0;
            transition: all var(--transition);
        }
        .teacher-note {
            background: var(--warning-light);
            border: 1px dashed var(--warning);
            border-radius: var(--radius-sm);
            padding: .75rem 1rem;
            margin: .75rem 0;
            font-size: .85rem;
        }
        .slide-nav {
            display: flex;
            gap: .5rem;
            align-items: center;
            justify-content: center;
            margin: 1rem 0;
            flex-wrap: wrap;
        }
        .slide-indicator {
            font-weight: 600;
            color: var(--text2);
        }
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, .6);
            z-index: 2000;
            display: flex;
            align-items: center;
            justify-content: center;
            animation: fadeIn .2s ease;
        }
        .modal {
            background: var(--surface);
            border-radius: var(--radius);
            padding: 2rem;
            max-width: 600px;
            width: 90%;
            max-height: 80vh;
            overflow-y: auto;
            box-shadow: var(--shadow-xl);
            position: relative;
        }
        .modal-close {
            position: absolute;
            top: .75rem;
            left: .75rem;
            background: var(--surface2);
            border: none;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 1rem;
            color: var(--text);
            display: flex;
            align-items: center;
            justify-content: center;
        }
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        .accordion-header {
            cursor: pointer;
            padding: .75rem 1rem;
            background: var(--surface2);
            border-radius: var(--radius-xs);
            font-weight: 600;
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin: .3rem 0;
            transition: background var(--transition);
        }
        .accordion-header:hover {
            background: var(--border);
        }
        .accordion-body {
            padding: .75rem 1rem;
            display: none;
            border-right: 2px solid var(--border);
            margin-right: .5rem;
        }
        .accordion-body.open {
            display: block;
        }
        .tooltip {
            position: relative;
        }
        .tooltip::after {
            content: attr(data-tooltip);
            position: absolute;
            bottom: 120%;
            right: 50%;
            transform: translateX(50%);
            background: var(--text);
            color: var(--bg);
            padding: .3rem .7rem;
            border-radius: 4px;
            font-size: .75rem;
            white-space: nowrap;
            opacity: 0;
            pointer-events: none;
            transition: opacity var(--transition);
            z-index: 10;
        }
        .tooltip:hover::after {
            opacity: 1;
        }
        @media (max-width: 900px) {
            .sidebar {
                transform: translateX(100%);
                width: 280px;
                z-index: 950;
            }
            .sidebar.open {
                transform: translateX(0);
            }
            .sidebar-toggle {
                display: flex;
            }
            .main-content {
                margin-right: 0 !important;
            }
            .navbar {
                padding: 0 1rem;
            }
            .hero-card h1 {
                font-size: 1.5rem;
            }
            .grid-2 {
                grid-template-columns: 1fr;
            }
            .search-bar {
                max-width: 200px;
            }
        }
        @media (max-width: 500px) {
            .navbar-brand {
                font-size: 1rem;
            }
            .navbar-brand .logo-icon {
                width: 30px;
                height: 30px;
                font-size: 1rem;
            }
            .btn {
                padding: .4rem .7rem;
                font-size: .75rem;
            }
            .main-content {
                padding: 1rem;
            }
            .card {
                padding: 1rem;
            }
        }
        .highlight-anim {
            animation: highlightPulse .6s ease;
        }
        @keyframes highlightPulse {
            0%, 100% { box-shadow: 0 0 0 0 rgba(59, 130, 246, 0); }
            50% { box-shadow: 0 0 0 12px rgba(59, 130, 246, .15); }
        }
        .fullscreen-mode {
            position: fixed !important;
            inset: 0 !important;
            z-index: 3000 !important;
            background: var(--bg) !important;
            overflow-y: auto !important;
            padding: 2rem !important;
            margin: 0 !important;
        }
        .sr-only {
            position: absolute;
            width: 1px;
            height: 1px;
            padding: 0;
            margin: -1px;
            overflow: hidden;
            clip: rect(0, 0, 0, 0);
            border: 0;
        }
    </style>
</head>
<body>
    <!-- Navbar -->
    <nav class="navbar" id="navbar">
        <div class="navbar-brand">
            <span class="logo-icon">Py</span>
            <span>آموزش پایتون</span>
        </div>
        <div class="navbar-actions">
            <div class="search-wrap">
                <div class="search-bar" id="searchBar">
                    <span class="search-icon">🔍</span>
                    <input type="text" id="searchInput" placeholder="جستجوی درس، مفهوم یا کد...">
                </div>
                <div class="search-results" id="searchResults"></div>
            </div>
            <button class="btn-icon tooltip" data-tooltip="حالت تاریک/روشن" id="themeToggle" aria-label="تغییر حالت رنگ">🌓</button>
            <button class="btn btn-outline btn-sm" id="goDashboard">🏠 داشبورد</button>
            <button class="sidebar-toggle" id="sidebarToggle" aria-label="منو">☰</button>
        </div>
    </nav>

    <!-- Sidebar -->
    <aside class="sidebar" id="sidebar">
        <div class="sidebar-section">📚 فهرست فصل‌ها</div>
        <div id="sidebarChapters"></div>
    </aside>

    <!-- Main Content -->
    <main class="main-content" id="mainContent">
        <div class="container" id="pageContent"></div>
    </main>

    <!-- Modal Container -->
    <div id="modalContainer"></div>

    <script>
        // ==================== DATA.JS - تمام محتوای آموزشی ====================
        const courseData = {
            chapters: [{
                id: 1,
                title: 'آشنایی با پایتون',
                icon: '🐍',
                lessons: [
                    { id: '1-1', title: 'پایتون چیست؟', duration: '۱۵ دقیقه', level: 'مبتدی',
                        prereq: 'هیچ', objectives: ['آشنایی با زبان پایتون', 'تاریخچه مختصر',

                        objectives: ['ساخت لیست وظایف'], content: {

                                    explain: 'enumerate() ایندکس و مقدار هر عنصر را همزمان برمی‌گرداند.' },

                    { id: '19-3', title: 'پروژه ۳: سیستم مدیریت دانش‌آموزان', duration: '۴۰ دقیقه', level: 'متوسط',
                        prereq: 'پروژه ۲', objectives: ['سیستم کامل CRUD'], content: {
                            codeExample: 'students = {}\ndef add_student(name, grade):\n    students[name] = grade\ndef show_all():\n    for name, grade in students.items():\n        print(f"{name}: {grade}")\ndef average():\n    return sum(students.values()) / len(students) if students else 0',
                            quiz: [
                                { q: 'CRUD مخفف چیست؟', options: ['Create,Read,Update,Delete',
                                        'Code,Run,Update,Debug', 'Class,Return,Use,Define', 'هیچکدام'
                                    ], answer: 0,
                                    explain: 'CRUD چهار عملیات اصلی پایگاه داده: ایجاد، خواندن، بروزرسانی، حذف.' },

        };

        // ==================== APP.JS - منطق اصلی برنامه ====================
        const STORAGE_KEY = 'python_course_progress';
        const THEME_KEY = 'python_course_theme';
        const MODE_KEY = 'python_course_mode';

        let currentMode = localStorage.getItem(MODE_KEY) || 'dashboard';
        let currentChapterId = 1;
        let currentLessonIndex = 0;
        let teacherSlideIndex = 0;
        let isSidebarOpen = true;
        let isFullscreen = false;

        const $ = (sel) => document.querySelector(sel);
        const $$ = (sel) => document.querySelectorAll(sel);

        const navbar = $('#navbar');
        const sidebar = $('#sidebar');
        const sidebarToggle = $('#sidebarToggle');
        const mainContent = $('#mainContent');
        const pageContent = $('#pageContent');
        const sidebarChapters = $('#sidebarChapters');
        const searchInput = $('#searchInput');
        const searchResults = $('#searchResults');
        const themeToggle = $('#themeToggle');
        const goDashboardBtn = $('#goDashboard');
        const modalContainer = $('#modalContainer');

        function initTheme() {
            const saved = localStorage.getItem(THEME_KEY);
            if (saved === 'dark') {
                document.body.classList.add('dark');
                themeToggle.textContent = '☀️';
            } else {
                document.body.classList.remove('dark');
                themeToggle.textContent = '🌙';
            }
        }

        function toggleTheme() {
            document.body.classList.toggle('dark');
            const isDark = document.body.classList.contains('dark');
            localStorage.setItem(THEME_KEY, isDark ? 'dark' : 'light');
            themeToggle.textContent = isDark ? '☀️' : '🌙';
        }
        themeToggle.addEventListener('click', toggleTheme);
        initTheme();

        function getProgress() {
            try { return JSON.parse(localStorage.getItem(STORAGE_KEY)) || {}; } catch { return {}; }
        }

        function saveProgress(progress) {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(progress));
        }

        function markLessonComplete(chapterId, lessonId) {
            const progress = getProgress();
            if (!progress.completedLessons) progress.completedLessons = [];
            if (!progress.completedLessons.includes(lessonId)) {
                progress.completedLessons.push(lessonId);
            }
            if (!progress.chapterProgress) progress.chapterProgress = {};
            const chLessons = getChapterLessons(chapterId);
            const completedInChapter = chLessons.filter(l => progress.completedLessons.includes(l.id)).length;
            progress.chapterProgress[chapterId] = Math.round((completedInChapter / chLessons.length) * 100);
            progress.lastLesson = lessonId;
            progress.lastAccess = new Date().toISOString();
            const totalLessons = courseData.chapters.reduce((sum, ch) => sum + ch.lessons.length, 0);
            const totalCompleted = progress.completedLessons.length;
            progress.overallPercent = Math.round((totalCompleted / totalLessons) * 100);
            saveProgress(progress);
            return progress;
        }

        function isLessonComplete(lessonId) {
            const progress = getProgress();
            return progress.completedLessons && progress.completedLessons.includes(lessonId);
        }

        function getChapterLessons(chapterId) {
            const chapter = courseData.chapters.find(c => c.id === chapterId);
            return chapter ? chapter.lessons : [];
        }

        function getOverallPercent() {
            return getProgress().overallPercent || 0;
        }

        function getChapterProgress(chapterId) {
            const progress = getProgress();
            return (progress.chapterProgress && progress.chapterProgress[chapterId]) || 0;
        }

        function saveQuizScore(lessonId, score, total) {
            const progress = getProgress();
            if (!progress.quizScores) progress.quizScores = {};
            progress.quizScores[lessonId] = { score, total, date: new Date().toISOString() };
            saveProgress(progress);
        }

        function buildSearchIndex() {
            const index = [];
            courseData.chapters.forEach(ch => {
                ch.lessons.forEach(lesson => {
                    const content = lesson.content;
                    const searchText = [
                        lesson.title, lesson.objectives ? lesson.objectives.join(' ') : '',
                        content.intro || '', content.simpleExplain || '', content.technicalNote || '',
                        content.syntax || '', content.codeExample || '', content.lineByLine || '',
                        content.realExample || '', content.classQuestion || '', content.classExercise || '',
                        content.exerciseAnswer || '', (content.commonMistakes || []).join(' '),
                        (content.keyPoints || []).join(' '),
                        (content.quiz || []).map(q => q.q + ' ' + q.options.join(' ') + ' ' + q.explain).join(' ')
                    ].join(' ').toLowerCase();
                    index.push({
                        chapterId: ch.id, chapterTitle: ch.title,
                        lessonId: lesson.id, lessonTitle: lesson.title, searchText
                    });
                });
            });
            return index;
        }
        const searchIndex = buildSearchIndex();

        function performSearch(query) {
            if (!query || query.trim().length < 2) { searchResults.classList.remove('show'); return []; }
            const q = query.trim().toLowerCase();
            return searchIndex.filter(item => item.searchText.includes(q)).slice(0, 15);
        }

        function showSearchResults(results) {
            searchResults.innerHTML = '';
            if (results.length === 0) {
                searchResults.innerHTML = '<div class="search-result-item" style="color:var(--text3)">نتیجه‌ای یافت نشد</div>';
            } else {
                results.forEach(r => {
                    const div = document.createElement('div');
                    div.className = 'search-result-item';
                    div.innerHTML = `<strong>${r.chapterTitle}</strong> › ${r.lessonTitle}`;
                    div.addEventListener('click', () => {
                        searchResults.classList.remove('show');
                        searchInput.value = '';
                        navigateToLesson(r.chapterId, r.lessonId);
                    });
                    searchResults.appendChild(div);
                });
            }
            searchResults.classList.add('show');
        }

        searchInput.addEventListener('input', () => showSearchResults(performSearch(searchInput.value)));
        searchInput.addEventListener('focus', () => { if (searchInput.value.trim().length >= 2) showSearchResults(performSearch(searchInput.value)); });
        document.addEventListener('click', (e) => { if (!searchResults.contains(e.target) && e.target !== searchInput) searchResults.classList.remove('show'); });

        function navigateToLesson(chapterId, lessonId) {
            const chapter = courseData.chapters.find(c => c.id === chapterId);
            if (!chapter) return;
            const lessonIndex = chapter.lessons.findIndex(l => l.id === lessonId);
            if (lessonIndex === -1) return;
            currentChapterId = chapterId;
            currentLessonIndex = lessonIndex;
            teacherSlideIndex = 0;
            if (currentMode === 'teacher') renderTeacherView();
            else if (currentMode === 'student') renderStudentView();
            updateSidebarActive();
            scrollToTop();
            const progress = getProgress();
            progress.lastChapterId = chapterId;
            progress.lastLessonId = lessonId;
            saveProgress(progress);
        }

        function scrollToTop() { mainContent.scrollTop = 0; window.scrollTo({ top: 0, behavior: 'smooth' }); }

        function updateSidebarActive() {
            $$('.sidebar-item').forEach(item => item.classList.remove('active'));
            const activeItem = $(`.sidebar-item[data-lesson-id="${getCurrentLessonId()}"]`);
            if (activeItem) activeItem.classList.add('active');
            const progress = getProgress();
            $$('.sidebar-item').forEach(item => {
                const lid = item.dataset.lessonId;
                if (lid && progress.completedLessons && progress.completedLessons.includes(lid)) item.classList.add('completed');
            });
        }

        function getCurrentLessonId() {
            const chapter = courseData.chapters.find(c => c.id === currentChapterId);
            if (!chapter || !chapter.lessons[currentLessonIndex]) return null;
            return chapter.lessons[currentLessonIndex].id;
        }

        function getCurrentLesson() {
            const chapter = courseData.chapters.find(c => c.id === currentChapterId);
            if (!chapter) return null;
            return chapter.lessons[currentLessonIndex] || null;
        }

        function buildSidebar() {
            sidebarChapters.innerHTML = '';
            const progress = getProgress();
            courseData.chapters.forEach(ch => {
                const chDiv = document.createElement('div');
                chDiv.className = 'sidebar-section';
                chDiv.textContent = `${ch.icon} ${ch.title}`;
                sidebarChapters.appendChild(chDiv);
                ch.lessons.forEach(lesson => {
                    const item = document.createElement('div');
                    item.className = 'sidebar-item';
                    item.dataset.lessonId = lesson.id;
                    item.dataset.chapterId = ch.id;
                    item.innerHTML = `<span class="chapter-num">${ch.id}</span><span>${lesson.title}</span><span class="check-icon">✅</span>`;
                    if (progress.completedLessons && progress.completedLessons.includes(lesson.id)) item.classList.add('completed');
                    item.addEventListener('click', () => {
                        if (currentMode === 'dashboard') setMode('student');
                        navigateToLesson(ch.id, lesson.id);
                        if (window.innerWidth <= 900) sidebar.classList.remove('open');
                    });
                    sidebarChapters.appendChild(item);
                });
            });
            updateSidebarActive();
        }
        buildSidebar();

        sidebarToggle.addEventListener('click', () => {
            if (window.innerWidth <= 900) {
                sidebar.classList.toggle('open');
            } else {
                isSidebarOpen = !isSidebarOpen;
                if (isSidebarOpen) { sidebar.classList.remove('closed'); mainContent.classList.remove('expanded'); }
                else { sidebar.classList.add('closed'); mainContent.classList.add('expanded'); }
            }
        });

        function setMode(mode) {
            currentMode = mode;
            localStorage.setItem(MODE_KEY, mode);
            teacherSlideIndex = 0;
            if (mode === 'dashboard') renderDashboard();
            else if (mode === 'teacher') {
                const progress = getProgress();
                if (progress.lastChapterId && progress.lastLessonId) navigateToLesson(progress.lastChapterId, progress.lastLessonId);
                else { currentChapterId = 1; currentLessonIndex = 0; renderTeacherView();
                    updateSidebarActive(); }
            } else if (mode === 'student') {
                const progress = getProgress();
                if (progress.lastChapterId && progress.lastLessonId) navigateToLesson(progress.lastChapterId, progress.lastLessonId);
                else { currentChapterId = 1; currentLessonIndex = 0; renderStudentView();
                    updateSidebarActive(); }
            }
            updateSidebarActive();
        }

        goDashboardBtn.addEventListener('click', () => setMode('dashboard'));

        function renderDashboard() {
            currentMode = 'dashboard';
            const progress = getProgress();
            const overallPercent = getOverallPercent();
            const totalLessons = courseData.chapters.reduce((sum, ch) => sum + ch.lessons.length, 0);
            const completedCount = progress.completedLessons ? progress.completedLessons.length : 0;
            const lastAccess = progress.lastAccess ? new Date(progress.lastAccess).toLocaleDateString('fa-IR') : 'هنوز شروع نشده';
            pageContent.innerHTML = `
            <div class="hero-card"><h1>🐍 آموزش کامل پایتون</h1><p>از صفر مطلق تا سطح متوسط - با دو حالت مدرس و خودآموز</p><div style="margin-top:1rem; display:flex; gap:.5rem; justify-content:center; flex-wrap:wrap;"><span class="badge" style="background:rgba(255,255,255,.2);color:#fff;">📚 ${courseData.chapters.length} فصل</span><span class="badge" style="background:rgba(255,255,255,.2);color:#fff;">📝 ${totalLessons} درس</span><span class="badge" style="background:rgba(255,255,255,.2);color:#fff;">🎯 مبتدی تا متوسط</span></div></div>
            <div class="card" style="text-align:center;"><h3>📊 پیشرفت کلی</h3><div style="font-size:2.5rem; font-weight:900; color:var(--primary);">${overallPercent}%</div><div class="progress-bar-wrap" style="max-width:400px; margin:.5rem auto;"><div class="progress-bar-fill" style="width:${overallPercent}%;"></div></div><p class="progress-text">${completedCount} از ${totalLessons} درس تکمیل شده</p><p style="color:var(--text3); font-size:.8rem;">آخرین بازدید: ${lastAccess}</p></div>
            <div class="grid-2"><div class="card mode-card teacher-card" onclick="setMode('teacher')"><div class="mode-icon">🎓</div><h3>حالت مدرس</h3><p>آموزش پایتون برای تدریس در کلاس<br>با اسلایدهای آماده، نکات مدرس و تمرین‌های کلاسی</p><button class="btn btn-primary" style="margin-top:.75rem;">ورود به حالت مدرس</button></div><div class="card mode-card student-card" onclick="setMode('student')"><div class="mode-icon">🧑‍💻</div><h3>حالت خودآموز</h3><p>یادگیری پایتون قدم‌به‌قدم<br>با توضیحات ساده، آزمون‌های تعاملی و پیگیری پیشرفت</p><button class="btn btn-accent" style="margin-top:.75rem;">شروع یادگیری</button></div></div>
            <div class="card"><h3>📑 پیشرفت فصل‌ها</h3>${courseData.chapters.map(ch => { const cp = getChapterProgress(ch.id); return `<div style="margin:.75rem 0;"><div style="display:flex; justify-content:space-between; font-size:.85rem;"><span>${ch.icon} ${ch.title}</span><span class="progress-text">${cp}%</span></div><div class="progress-bar-wrap"><div class="progress-bar-fill" style="width:${cp}%;"></div></div></div>`; }).join('')}</div>`;
            updateSidebarActive();
            scrollToTop();
        }

        function renderTeacherView() {
            currentMode = 'teacher';
            const lesson = getCurrentLesson();
            if (!lesson) return;
            const chapter = courseData.chapters.find(c => c.id === currentChapterId);
            const content = lesson.content;
            const slides = [
                { title: '🎯 اطلاعات جلسه', html: `<p><strong>عنوان:</strong> ${lesson.title}</p><p><strong>شماره جلسه:</strong> ${chapter.id}-${currentLessonIndex+1}</p><p><strong>مدت زمان:</strong> ${lesson.duration}</p><p><strong>سطح:</strong> ${lesson.level}</p><p><strong>پیش‌نیاز:</strong> ${lesson.prereq}</p><p><strong>اهداف:</strong> ${(lesson.objectives||[]).join(' | ')}</p>` },
                { title: '📖 معرفی مفهوم', html: `<p>${content.intro||''}</p>` },
                { title: '🗣️ توضیح ساده برای دانش‌آموز', html: `<p style="font-size:1.1rem;">${content.simpleExplain||''}</p>` },
                { title: '🔧 توضیح فنی برای مدرس', html: `<div class="teacher-note">📌 <strong>نکته مدرس:</strong> ${content.technicalNote||''}</div>` },
                { title: '📝 Syntax', html: `<div class="code-block">${escapeHtml(content.syntax||'')}</div>` },
                { title: '💻 مثال کد', html: `<div class="code-block">${escapeHtml(content.codeExample||'')}<button class="copy-btn" onclick="copyCode(this)">📋 کپی</button></div>` },
                { title: '🔍 توضیح خط‌به‌خط', html: `<pre style="white-space:pre-wrap;background:var(--surface2);padding:1rem;border-radius:8px;">${content.lineByLine||''}</pre>` },
                { title: '🌍 مثال واقعی', html: `<p>${content.realExample||''}</p>` },
                { title: '❓ سؤال برای دانش‌آموز', html: `<div style="background:var(--primary-light);padding:1rem;border-radius:8px;font-size:1.1rem;">${content.classQuestion||''}</div>` },
                { title: '✏️ تمرین کلاسی', html: `<p><strong>تمرین:</strong> ${content.classExercise||''}</p><button class="btn btn-outline btn-sm" id="toggleExerciseAnswer">نمایش پاسخ</button><div id="exerciseAnswer" style="display:none;margin-top:.5rem;background:var(--accent-light);padding:.75rem;border-radius:8px;">${content.exerciseAnswer||''}</div>` },
                { title: '⚠️ اشتباهات رایج', html: `<ul>${(content.commonMistakes||[]).map(m=>`<li>${m}</li>`).join('')}</ul>` },
                { title: '⭐ نکات کلیدی برای تأکید', html: `<ul>${(content.keyPoints||[]).map(k=>`<li><strong>${k}</strong></li>`).join('')}</ul>` },
            ];
            const totalSlides = slides.length;
            if (teacherSlideIndex >= totalSlides) teacherSlideIndex = totalSlides - 1;
            if (teacherSlideIndex < 0) teacherSlideIndex = 0;
            const currentSlide = slides[teacherSlideIndex];
            pageContent.innerHTML = `
            <div class="card" id="teacherContent"><div style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:.5rem;"><h2>🎓 حالت مدرس</h2><span class="badge badge-primary">${chapter.icon} ${chapter.title} › ${lesson.title}</span></div><div class="teacher-section"><h3>${currentSlide.title}</h3><div id="slideContent">${currentSlide.html}</div></div><div class="slide-nav"><button class="btn btn-outline btn-sm" id="prevSlide" ${teacherSlideIndex===0?'disabled':''}>◀ اسلاید قبل</button><span class="slide-indicator">${teacherSlideIndex+1} / ${totalSlides}</span><button class="btn btn-outline btn-sm" id="nextSlide" ${teacherSlideIndex>=totalSlides-1?'disabled':''}>اسلاید بعد ▶</button><button class="btn btn-primary btn-sm" id="showForClass">📺 نمایش برای کلاس</button><button class="btn btn-outline btn-sm" id="toggleFullscreen">🖥️ تمام‌صفحه</button></div><div style="text-align:center; margin-top:.5rem;"><button class="btn btn-accent btn-sm" id="markTeacherComplete">✅ تدریس این درس انجام شد</button></div></div>`;
            $('#prevSlide').addEventListener('click', () => { if (teacherSlideIndex > 0) { teacherSlideIndex--;
                    renderTeacherView(); } });
            $('#nextSlide').addEventListener('click', () => { if (teacherSlideIndex < totalSlides - 1) { teacherSlideIndex++;
                    renderTeacherView(); } });
            $('#showForClass').addEventListener('click', () => { const slideContent = $('#slideContent').innerHTML;
                showModal(currentSlide.title, slideContent, true); });
            $('#toggleFullscreen').addEventListener('click', () => { const el = $('#teacherContent');
                isFullscreen = !isFullscreen;
                el.classList.toggle('fullscreen-mode', isFullscreen);
                $('#toggleFullscreen').textContent = isFullscreen ? '🚪 خروج از تمام‌صفحه' : '🖥️ تمام‌صفحه'; if (isFullscreen) el.scrollIntoView(); });
            const toggleAnsBtn = $('#toggleExerciseAnswer');
            if (toggleAnsBtn) { toggleAnsBtn.addEventListener('click', () => { const ans = $('#exerciseAnswer'); if (ans) { const isHidden = ans.style.display === 'none';
                        ans.style.display = isHidden ? 'block' : 'none';
                        toggleAnsBtn.textContent = isHidden ? 'مخفی کردن پاسخ' : 'نمایش پاسخ'; } }); }
            $('#markTeacherComplete').addEventListener('click', () => { markLessonComplete(currentChapterId, lesson.id);
                buildSidebar();
                updateSidebarActive();
                showToast('✅ این درس به عنوان تدریس‌شده ثبت شد'); });
            updateSidebarActive();
            scrollToTop();
        }

        function renderStudentView() {
            currentMode = 'student';
            const lesson = getCurrentLesson();
            if (!lesson) return;
            const chapter = courseData.chapters.find(c => c.id === currentChapterId);
            const content = lesson.content;
            const isComplete = isLessonComplete(lesson.id);
            const quiz = content.quiz || [];
            pageContent.innerHTML = `
            <div class="card"><div style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:.5rem;"><h2>🧑‍💻 حالت خودآموز</h2><span class="badge badge-accent">${chapter.icon} ${chapter.title} › ${lesson.title}</span></div>${isComplete ? '<span class="badge badge-accent">✅ تکمیل شده</span>' : ''}</div>
            <div class="card"><h3>📖 توضیح ساده</h3><p style="font-size:1.1rem;">${content.simpleExplain||content.intro||''}</p></div>
            <div class="card"><h3>💻 مثال</h3><div class="code-block">${escapeHtml(content.codeExample||'')}<button class="copy-btn" onclick="copyCode(this)">📋 کپی</button></div></div>
            <div class="card"><h3>🔍 توضیح کد (خط‌به‌خط)</h3><pre style="white-space:pre-wrap;background:var(--surface2);padding:1rem;border-radius:8px;">${content.lineByLine||''}</pre></div>
            ${content.realExample ? `<div class="card"><h3>🌍 مثال واقعی</h3><p>${content.realExample}</p></div>` : ''}
            <div class="card"><h3>✏️ تمرین</h3><p>${content.classExercise||'تمرین این درس را انجام دهید.'}</p><button class="btn btn-outline btn-sm" id="toggleStudentAnswer">نمایش پاسخ</button><div id="studentAnswer" style="display:none;margin-top:.5rem;background:var(--accent-light);padding:.75rem;border-radius:8px;"><strong>پاسخ:</strong> ${content.exerciseAnswer||''}</div></div>
            ${quiz.length > 0 ? `<div class="card" id="quizCard"><h3>📝 آزمون کوتاه</h3><div id="quizContainer">${quiz.map((q, qi) => `<div class="quiz-question" data-qindex="${qi}" style="margin:1rem 0; padding:.75rem; border:1px solid var(--border); border-radius:8px;"><p><strong>سوال ${qi+1}:</strong> ${q.q}</p>${q.options.map((opt, oi) => `<button class="quiz-option" data-qindex="${qi}" data-oindex="${oi}">${opt}</button>`).join('')}<div class="quiz-feedback" style="margin-top:.5rem; display:none;"></div></div>`).join('')}</div><div id="quizResult" style="text-align:center; margin-top:1rem; font-weight:700;"></div></div>` : ''}
            <div class="card" style="text-align:center;"><button class="btn btn-accent" id="markStudentComplete" ${isComplete?'disabled':''}>${isComplete ? '✅ درس تکمیل شده' : '✓ درس را کامل کردم'}</button></div>
            <div class="slide-nav"><button class="btn btn-outline btn-sm" id="prevLesson" ${currentLessonIndex===0?'disabled':''}>◀ درس قبل</button><span class="slide-indicator">درس ${currentLessonIndex+1} از ${chapter.lessons.length}</span><button class="btn btn-outline btn-sm" id="nextLesson" ${currentLessonIndex>=chapter.lessons.length-1?'disabled':''}>درس بعد ▶</button></div>`;
            const toggleAns = $('#toggleStudentAnswer');
            if (toggleAns) { toggleAns.addEventListener('click', () => { const ans = $('#studentAnswer'); const isHidden = ans.style.display === 'none';
                    ans.style.display = isHidden ? 'block' : 'none';
                    toggleAns.textContent = isHidden ? 'مخفی کردن پاسخ' : 'نمایش پاسخ'; }); }
            const answeredQuestions = {};
            $$('.quiz-option').forEach(btn => { btn.addEventListener('click', function() { const qIndex = parseInt(this.dataset.qindex); const oIndex = parseInt(this.dataset.oindex); if (answeredQuestions[qIndex] !== undefined) return;
                    answeredQuestions[qIndex] = oIndex; const question = quiz[qIndex]; const isCorrect = oIndex === question.answer; const allOptions = $$(`.quiz-option[data-qindex="${qIndex}"]`);
                    allOptions.forEach(opt => opt.disabled = true);
                    this.classList.add(isCorrect ? 'correct' : 'wrong');
                    allOptions[question.answer].classList.add('correct'); const feedback = this.parentElement.querySelector('.quiz-feedback'); if (feedback) { feedback.style.display = 'block';
                        feedback.innerHTML = isCorrect ? '<span style="color:var(--accent);">✅ درست! </span>' : '<span style="color:var(--danger);">❌ غلط! </span>';
                        feedback.innerHTML += question.explain; } if (Object.keys(answeredQuestions).length === quiz.length) { const correctCount = Object.entries(answeredQuestions).filter(([qi, oi]) => oi === quiz[parseInt(qi)].answer).length;
                        $('#quizResult').innerHTML = `نتیجه: ${correctCount} از ${quiz.length} پاسخ صحیح | نمره: ${Math.round(correctCount/quiz.length*100)}%`;
                        saveQuizScore(lesson.id, correctCount, quiz.length); } }); });
            $('#markStudentComplete').addEventListener('click', function() { if (this.disabled) return;
                markLessonComplete(currentChapterId, lesson.id);
                buildSidebar();
                updateSidebarActive();
                this.disabled = true;
                this.textContent = '✅ درس تکمیل شده';
                showToast('🎉 درس با موفقیت تکمیل شد! پیشرفت شما ذخیره گردید.'); });
            $('#prevLesson').addEventListener('click', () => { if (currentLessonIndex > 0) { currentLessonIndex--;
                    teacherSlideIndex = 0;
                    renderStudentView();
                    updateSidebarActive();
                    scrollToTop(); } });
            $('#nextLesson').addEventListener('click', () => { if (currentLessonIndex < chapter.lessons.length - 1) { currentLessonIndex++;
                    teacherSlideIndex = 0;
                    renderStudentView();
                    updateSidebarActive();
                    scrollToTop(); } });
            updateSidebarActive();
            scrollToTop();
        }

        function escapeHtml(str) { if (!str) return ''; const div = document.createElement('div');
            div.textContent = str; return div.innerHTML; }

        function copyCode(btn) { const codeBlock = btn.parentElement; const code = codeBlock.textContent.replace(/📋 کپی/g, '').trim();
            navigator.clipboard.writeText(code).then(() => { btn.textContent = '✅ کپی شد';
                setTimeout(() => { btn.textContent = '📋 کپی'; }, 2000); }).catch(() => { btn.textContent = '⚠️ خطا';
                setTimeout(() => { btn.textContent = '📋 کپی'; }, 2000); }); }

        function showModal(title, content, isLarge = false) { modalContainer.innerHTML = `<div class="modal-overlay" id="modalOverlay"><div class="modal" style="${isLarge?'max-width:90vw;':''}"><button class="modal-close" id="modalClose">✕</button><h3>${title}</h3><div>${content}</div></div></div>`;
            $('#modalClose').addEventListener('click', () => { modalContainer.innerHTML = ''; });
            $('#modalOverlay').addEventListener('click', function(e) { if (e.target === this) modalContainer.innerHTML = ''; });
            document.addEventListener('keydown', function escHandler(e) { if (e.key === 'Escape') { modalContainer.innerHTML = '';
                    document.removeEventListener('keydown', escHandler); } }); }

        function showToast(message) { const toast = document.createElement('div');
            toast.style.cssText = `position: fixed; bottom: 2rem; left: 50%; transform: translateX(-50%); background: var(--text); color: var(--bg); padding: .75rem 1.5rem; border-radius: 30px; font-weight: 600; z-index: 5000; box-shadow: var(--shadow-xl); animation: fadeIn .3s ease; font-family: var(--font);`;
            toast.textContent = message;
            document.body.appendChild(toast);
            setTimeout(() => { toast.style.opacity = '0';
                toast.style.transition = 'opacity .3s ease';
                setTimeout(() => toast.remove(), 300); }, 2500); }

        document.addEventListener('keydown', (e) => { if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return; if (currentMode === 'teacher') { if (e.key === 'ArrowRight' || e.key === 'ArrowDown') { e.preventDefault(); if (teacherSlideIndex < 12) { teacherSlideIndex++;
                        renderTeacherView(); } } else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') { e.preventDefault(); if (teacherSlideIndex > 0) { teacherSlideIndex--;
                        renderTeacherView(); } } } });

        function init() { const savedMode = localStorage.getItem(MODE_KEY) || 'dashboard'; const progress = getProgress(); if (progress.lastChapterId && progress.lastLessonId) { currentChapterId = progress.lastChapterId; const ch = courseData.chapters.find(c => c.id === currentChapterId); if (ch) { const li = ch.lessons.findIndex(l => l.id === progress.lastLessonId); if (li !== -1) currentLessonIndex = li; } }
            setMode(savedMode);
            buildSidebar();
            updateSidebarActive(); }
        window.addEventListener('resize', () => { if (window.innerWidth > 900 && sidebar.classList.contains('open')) sidebar.classList.remove('open'); });
        init();
    </script>
</body>
</html>
